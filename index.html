<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Study</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <nav id="nav-bar">
      <button data-nav="intro">Intro</button>
      <button data-nav="map">Map</button>
      <button data-nav="case">Case</button>
      <button data-nav="simulator">Simulator</button>
      <button data-nav="boss">Boss</button>
      <button data-nav="cutscene">Cutscene</button>
    </nav>

    <main id="screen-root">
      <section id="screen-intro" class="screen" data-screen="intro">
        <h1>Intro</h1>
        <p>시작 화면입니다.</p>

        <form id="character-form" class="character-form">
          <div class="form-row">
            <label for="character-name">이름</label>
            <input type="text" id="character-name" name="character-name" placeholder="이름을 입력하세요" autocomplete="off" />
          </div>

          <div class="form-row">
            <span class="form-label">성별</span>
            <div id="gender-select" class="gender-select">
              <button type="button" class="gender-btn" data-gender="male">남</button>
              <button type="button" class="gender-btn" data-gender="female">여</button>
              <button type="button" class="gender-btn" data-gender="other">기타</button>
            </div>
          </div>

          <button type="submit" id="character-confirm" class="confirm-btn">확인</button>
        </form>

        <p id="character-result" class="character-result" hidden></p>
      </section>

      <section id="screen-map" class="screen" data-screen="map" hidden>
        <h1>Map</h1>
        <p>맵 화면입니다.</p>

        <div id="case-grid" class="case-grid">
          <button type="button" class="case-card" data-case="01">케이스 01</button>
          <button type="button" class="case-card" data-case="02">케이스 02</button>
          <button type="button" class="case-card" data-case="03">케이스 03</button>
          <button type="button" class="case-card" data-case="04">케이스 04</button>
          <button type="button" class="case-card" data-case="05">케이스 05</button>
        </div>
      </section>

      <section id="screen-case" class="screen" data-screen="case" hidden>
        <h1>Case</h1>
        <p>사건 화면입니다.</p>

        <div class="briefing">
          <div class="briefing-character">NOVA</div>
          <div class="briefing-panel">
            <div class="briefing-dialogue">
              <p id="briefing-line"></p>
            </div>
            <button type="button" id="briefing-next" class="briefing-next-btn">다음</button>
          </div>
        </div>
      </section>

      <section id="screen-simulator" class="screen" data-screen="simulator" hidden>
        <h1>Simulator</h1>
        <p>시뮬레이터 화면입니다.</p>
      </section>

      <section id="screen-boss" class="screen" data-screen="boss" hidden>
        <h1>Boss</h1>
        <p>보스전 화면입니다.</p>
      </section>

      <section id="screen-cutscene" class="screen" data-screen="cutscene" hidden>
        <div id="cutscene-stage" class="cutscene-stage">
          <div class="cutscene-character">NOVA</div>
          <div class="cutscene-dialogue">
            <p id="cutscene-line"></p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="router.js"></script>
  <script src="main.js"></script>
</body>
</html>
